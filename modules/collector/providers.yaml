# 数据源提供者配置
# 所有数据源的优先级、质量评分、启用状态均在此配置
# 每个 Provider 的具体字段映射和获取逻辑在对应适配器代码中
# 新增数据源只需在此文件添加配置 + 编写适配器类

providers:
  qmt:
    class: modules.collector.adapters.qmt_provider.QMTProvider
    type: database
    enabled: true
    priority: 0
    cost_type: free
    description: QMT 国信iQuant数据源（券商直连），通过数据库桥接获取K线/财务/股东等12类数据
    capabilities:
      kline_daily:
        quality_score: 0.98
      daily_basic:
        quality_score: 0.95
      financial_income:
        quality_score: 0.95
      financial_balance:
        quality_score: 0.95
      financial_cashflow:
        quality_score: 0.95
      financial_per_share:
        quality_score: 0.95
      shareholder_top10:
        quality_score: 0.95
      shareholder_count:
        quality_score: 0.90
      st_status:
        quality_score: 0.99
      ipo_info:
        quality_score: 0.99
      tick_data:
        quality_score: 0.95
      longhubang:
        quality_score: 0.95
      realtime_depth:
        quality_score: 0.98

  tushare:
    class: modules.collector.adapters.tushare_provider.TushareProvider
    type: http
    enabled: true
    priority: 0
    cost_type: paid
    description: Tushare Pro 数据源（付费），支持A股全市场含北交所
    capabilities:
      kline_daily:
        quality_score: 0.95

  jqdata:
    class: modules.collector.adapters.jqdata_provider.JqdataProvider
    type: http
    enabled: true
    priority: 1
    cost_type: free
    description: JoinQuant 聚宽数据源（免费），不含北交所
    capabilities:
      kline_daily:
        quality_score: 0.85

  eastmoney:
    class: modules.collector.adapters.akshare.eastmoney.EastmoneyProvider
    type: akshare
    enabled: true
    priority: 2
    cost_type: free
    description: 东方财富公开数据接口（AkShare）
    capabilities:
      stock_basic:
        quality_score: 0.8
      kline_daily:
        quality_score: 0.8
      realtime_quote:
        quality_score: 0.9
      stock_industry:
        quality_score: 0.3

  sina:
    class: modules.collector.adapters.akshare.sina.SinaProvider
    type: akshare
    enabled: true
    priority: 3
    cost_type: free
    description: 新浪财经数据接口（AkShare）
    capabilities:
      stock_basic:
        quality_score: 0.7
      kline_daily:
        quality_score: 0.7
      realtime_quote:
        quality_score: 0.7

  tencent:
    class: modules.collector.adapters.akshare.tencent.TencentProvider
    type: akshare
    enabled: true
    priority: 4
    cost_type: free
    description: 腾讯财经数据接口（AkShare）
    capabilities:
      stock_basic:
        quality_score: 0.6
      kline_daily:
        quality_score: 0.6

  mootdx:
    class: modules.collector.adapters.mootdx_provider.TdxProvider
    type: tcp
    enabled: true
    priority: 5
    cost_type: free
    description: 通达信数据源（mootdx TCP协议），绕过HTTP代理获取行业/地区/K线
    capabilities:
      stock_industry:
        quality_score: 0.8
      stock_area:
        quality_score: 0.7
      kline_daily:
        quality_score: 0.85
      concept:
        quality_score: 0.8

  baostock:
    class: modules.collector.adapters.baostock_provider.BaostockProvider
    type: baostock
    enabled: true
    priority: 6
    cost_type: free
    description: 证券宝数据源，免费无需注册，支持A股日K线
    capabilities:
      kline_daily:
        quality_score: 0.9

# 编排策略配置
orchestration:
  stock_basic:
    # 行业/地域字段补齐策略：采集完基础信息后按此顺序尝试补齐
    field_completion:
      industry:
        strategy: try_providers_in_order
        required_coverage: 0.8   # 行业字段覆盖率目标 > 80%
      area:
        strategy: try_providers_in_order
        required_coverage: 0.7

  kline_daily:
    # K线数据源优先级覆盖（按优先级排序）
    provider_order:
      - qmt
      - tushare
      - jqdata
      - mootdx
      - baostock
      - eastmoney
      - sina
      - tencent
    # K线关键字段：必须全部有值才认为成功
    required_fields:
      - trade_date
      - open
      - high
      - low
      - close
    # 期望有值但不强制的字段
    expected_fields:
      - pre_close
      - volume
      - amount
      - turnover_rate
      - pct_chg

  # QMT 新增数据类别编排策略
  daily_basic:
    provider_order:
      - qmt
    required_fields:
      - ts_code
      - trade_date

  financial_income:
    provider_order:
      - qmt
    required_fields:
      - ts_code
      - end_date

  financial_balance:
    provider_order:
      - qmt
    required_fields:
      - ts_code
      - end_date

  financial_cashflow:
    provider_order:
      - qmt
    required_fields:
      - ts_code
      - end_date

  financial_per_share:
    provider_order:
      - qmt
    required_fields:
      - ts_code
      - end_date

  shareholder_top10:
    provider_order:
      - qmt
    required_fields:
      - ts_code
      - ann_date

  shareholder_count:
    provider_order:
      - qmt
    required_fields:
      - ts_code
      - ann_date

  st_status:
    provider_order:
      - qmt
    required_fields:
      - ts_code

  ipo_info:
    provider_order:
      - qmt
    required_fields:
      - ts_code

  tick_data:
    provider_order:
      - qmt
    required_fields:
      - ts_code
      - trade_time

  longhubang:
    provider_order:
      - qmt
    required_fields:
      - ts_code
      - trade_date

  realtime_depth:
    provider_order:
      - qmt
    required_fields:
      - symbol
