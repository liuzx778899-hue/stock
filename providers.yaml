# 数据源提供者配置
# 所有数据源的优先级、质量评分、启用状态均在此配置
# 每个 Provider 的具体字段映射和获取逻辑在对应适配器代码中
# 新增数据源只需在此文件添加配置 + 编写适配器类

providers:
  eastmoney:
    class: adapters.akshare.eastmoney.EastmoneyProvider
    type: akshare
    enabled: true
    priority: 1
    cost_type: free
    description: 东方财富公开数据接口（AkShare）
    capabilities:
      stock_basic:
        quality_score: 0.8
      kline_daily:
        quality_score: 0.8
      realtime_quote:
        quality_score: 0.9
      stock_industry:
        quality_score: 0.3

  sina:
    class: adapters.akshare.sina.SinaProvider
    type: akshare
    enabled: true
    priority: 2
    cost_type: free
    description: 新浪财经数据接口（AkShare）
    capabilities:
      stock_basic:
        quality_score: 0.7
      kline_daily:
        quality_score: 0.7
      realtime_quote:
        quality_score: 0.7

  tencent:
    class: adapters.akshare.tencent.TencentProvider
    type: akshare
    enabled: true
    priority: 3
    cost_type: free
    description: 腾讯财经数据接口（AkShare）
    capabilities:
      stock_basic:
        quality_score: 0.6
      kline_daily:
        quality_score: 0.6

  biying:
    class: adapters.biying.BiyingProvider
    type: http
    enabled: true
    priority: 4
    cost_type: paid
    description: 必盈API付费数据源，需有效Licence
    capabilities:
      stock_basic:
        quality_score: 0.85
      stock_industry:
        quality_score: 0.9
      stock_area:
        quality_score: 0.9
      kline_daily:
        quality_score: 0.9
      realtime_quote:
        quality_score: 0.85

# 编排策略配置
orchestration:
  stock_basic:
    # 行业/地域字段补齐策略：采集完基础信息后按此顺序尝试补齐
    field_completion:
      industry:
        strategy: try_providers_in_order
        required_coverage: 0.8   # 行业字段覆盖率目标 > 80%
      area:
        strategy: try_providers_in_order
        required_coverage: 0.7

  kline_daily:
    # K线关键字段：必须全部有值才认为成功
    required_fields:
      - trade_date
      - open
      - high
      - low
      - close
    # 期望有值但不强制的字段
    expected_fields:
      - pre_close
      - volume
      - amount
      - turnover_rate
      - pct_chg
